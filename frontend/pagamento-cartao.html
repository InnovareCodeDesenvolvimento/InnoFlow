    <!--
      DOCUMENTO ISOLADO (F5.3 — cartão salvo, SAQ A-EP). Decisão do dono em
      `.claude/agent-memory/nova/decisoes-f5-pagamento-cielo.md` §2: CSP vale

      formulário de cartão mora aqui, com build PRÓPRIA do Vite (ver
      `vite.pagamento-cartao.config.ts` — build SEPARADA da SPA principal

      arquivo), servida pelo Nginx com CSP rígida SÓ PARA ESTE ARQUIVO
      (ver nginx.conf.template, location `= /pagamento-cartao.html`).

      REGRA PARA QUEM MEXER NESTE ARQUIVO: nenhum <script>/<link>/<style> de
      terceiro aqui — nem Google Fonts, nem analytics, nada. Só o bundle
      próprio abaixo e, dinamicamente DENTRO dele (nunca neste HTML
      estático), o script oficial de tokenização da Cielo (Silent Order
      Post) quando a URL real for confirmada (ver
      `src/pagamento-cartao/sopClient.ts`). É isso que reduz a superfície de
      ataque desta página a quase zero — fácil de auditar porque é POUCO
      código, de propósito.

      Nunca navegável a partir do app principal por link/rota — só é aberta
      via `window.open` por `useAddCardFlow.ts`, e nunca deve ser embutida em
      iframe (ver `frame-ancestors 'none'` na CSP desta location).
    -->
